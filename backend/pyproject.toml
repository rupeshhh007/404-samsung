[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interlock"
version = "0.1.0"
description = "INTERLOCK consistency runtime for interruptible real-time agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0,<1.0.0",
    "livekit-agents==1.8.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn==0.54.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["interlock*"]
